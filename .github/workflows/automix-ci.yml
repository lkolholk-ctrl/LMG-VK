name: AutoMix CI & Verification

on:
  push:
    branches:
      - 'feat/ios26-automix'
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native_automix_tests:
    name: Native C++ AutoMix Tests (39 suites)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S native/automix -B build_native \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLMG_AUTOMIX_SANITIZERS=OFF

      - name: Build Native Tests
        run: |
          cmake --build build_native --parallel 2

      - name: Run CTest Verification
        run: |
          ctest --test-dir build_native --output-on-failure

  android_kotlin_check:
    name: Android Kotlin & Media3 Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fetch forked media3 AARs
        run: |
          VER=1.5.1-lmg30
          curl -sSL -o media3-m2.zip \
            "https://github.com/lkolholk-ctrl/media3-lmg/releases/download/v${VER}/media3-${VER}-m2.zip"
          mkdir -p media3-m2
          unzip -q media3-m2.zip -d media3-m2

      - name: Run Automix Host Unit Tests
        run: |
          ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Compile Kotlin Codebase
        run: |
          ./gradlew compileDebugKotlin --stacktrace
